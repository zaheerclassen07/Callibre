<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Loading…</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; background: #0B1220; color: #EEF2FF; font-family: 'DM Sans', 'Inter', sans-serif; min-height: 100vh; }
      #app-preloader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; gap: 16px;
      }
      #app-preloader .spinner {
        width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08);
        border-top-color: #F5C842; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #app-preloader .label { font-size: 13px; color: #7A8EAA; letter-spacing: 0.5px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="spinner"></div>
        <div class="label">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
